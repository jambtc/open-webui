services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
      - ./custom/boxedai-branding.zip:/custom/boxedai-branding.zip:ro
      - ./custom/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-127.0.0.1:3001}:8080
    environment:
      - WEBUI_AUTH=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=Boxed AI
      - ENABLE_PIPES=true
      - PIPELINES_URL=${OPENCLAW_OPENAI_PROXY:-http://host.docker.internal:4010}
    command: ["bash", "/entrypoint.sh"]
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mvp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

volumes:
  ollama: {}
  open-webui: {}
  qdrant: {}
